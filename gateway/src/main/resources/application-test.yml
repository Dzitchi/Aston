spring:
  config:
    import: ""

  application:
    name: gateway

  cloud:
    discovery:
      enabled: false

    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:${wiremock.server.port}
              predicates:
                - Path=/api/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userServiceCircuitBreaker
                    fallbackUri: forward:/fallback/users

            - id: notification-service
              uri: http://localhost:${wiremock.server.port}
              predicates:
                - Path=/api/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notificationServiceCircuitBreaker
                    fallbackUri: forward:/fallback/notifications

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

  endpoint:
    gateway:
      enabled: true
